# GRPO preset configuration
# Train an LLM with Group Relative Policy Optimization on math problems.
#
# Default values below are tuned for Qwen3-0.6B on GSM8K with a single GPU.
# Adjust model / data_path for your setup.

# ------------------- [common] -------------------
preset: grpo                            # razordl train 读取此项选择 preset（--preset 可覆盖）
model: Qwen/Qwen3-0.6B
# Dataset path — populated automatically when the project is generated.
# If you want to use your own data, point this to your data directory.
data_path: ./data
outputs_dir: ./outputs               # 实验输出父目录；框架自动生成时间戳子目录

# GRPO-specific
batch_size: 2
group_size: 8
loss_micro_batch_size: 0    # GRPO loss 步内 micro-batch 条数。0=历史默认(按 prompt batch 切块);>0 降激活峰值(实测 =1 时 11G->7.3G)
kl_coef: 0.001
clip_eps: 0.2
max_completion_length: 2048
temperature: 0.9
top_p: 0.9
top_k: 50

# Data
max_length: 512

# LoRA (disabled by default — LoRA weight sync not yet supported in vLLM V1)
use_adapter: false
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: [q_proj, v_proj, k_proj, o_proj]

# Optimizer
lr: 1.0e-06
weight_decay: 0.01
max_grad_norm: 1.0
grad_accum: 8

# Training
num_epochs: 2
num_workers: 2
seed: 42

# Logging & Checkpointing
log_steps: 1
save_steps: 5
save_ckpt_steps: 5
resume_mode: auto                  # auto=自动检测恢复(哈希校验) | manual=必须写 resume_from
resume_from:                      # manual模式指定实验路径，auto模式忽略（默认注释）
init_from:                        # 从此checkpoint分叉新实验（新目录，只加载权重）
compute_checksums: false  # 保存 checkpoint 时计算 SHA256（增加 IO，可选完整性校验）

# ------------------- [advanced] -------------------
enable_gradient_checkpointing: true
# enable_activation_offload: false      # 激活异步offload。true=长序列省显存（>32K开启），对小模型/短序列反致OOM
offload_param: false
offload_optimizer: false
fused_linear_tile_size: 2048    # GRPO/OPD logp 流式 lm_head 的序列 tile 大小(token)
sp_size: 1
parallel_backend: fsdp2                    # 并行后端。fsdp2=省显存, ddp=小模型更快
precision: auto                          # auto|bf16|fp16|fp32。auto：有 CUDA 一律 bf16(老卡为软件模拟，与 fp16 实测持平且无需 loss scaling)，无卡 fp32；半精度均保留 fp32 主权重

ray_kwargs:
  ray_init: {}
